[advisories]
yanked = "deny"

# **不要把 advisories 整段降成 `"warn"`/`"allow"`。** 这个项目的
# `rustls-pemfile`（RUSTSEC-2025-0134）正是靠 `cargo deny check advisories`
# 变红才被发现并迁移掉的（改成直接用 `rustls-pki-types` 的 `PemObject`），
# 那条通道要留着。要豁免就逐条豁免，每条写清楚理由。
ignore = [
    # RUSTSEC-2026-0192：`ttf-parser` unmaintained。
    #
    # 跟 `webpki-roots` 的 CDLA-Permissive-2.0 一样，这是一次刻意拍板，
    # 不是被 CI 逼红之后顺手糊过去。
    #
    # **是哪个包**：`ttf-parser 0.25.1`，经
    # `iced_tiny_skia` / `iced_graphics` → `cosmic-text 0.15` → `fontdb 0.23`
    # 拉进来。它是 iced 文本排版链路上的 TrueType/OpenType 字形解析器。
    #
    # **为什么绕不开**：公告本身写着 "No safe upgrade is available!"——
    # 作者归档了仓库，推荐改用 `skrifa`，但那是 `fontdb`/`cosmic-text`
    # 要做的迁移，不是我们能单方面做的；而 iced 0.14 把 `cosmic-text`
    # 钉在 0.15。除非不用 iced（或自己 fork 整条文本链路），否则这条
    # 消不掉。
    #
    # **为什么可以接受**：这是 `unmaintained` 而不是 `vulnerability`——
    # 公告里没有任何已知的可利用缺陷，只是"作者不再维护"。而且
    # `ttf-parser` 是纯 Rust、`#![no_std]`、`#![forbid(unsafe_code)]` 的
    # 解析库，输入是我们自己进程里加载的系统字体文件，不是网络上来的
    # 不可信数据——威胁模型跟"解析远端发来的 TLS 证书"完全不同。
    #
    # **什么条件下重新评估**：
    #   1. 这条公告从 `unmaintained` 升级成 `vulnerability`（出现真实 CVE）
    #      ——立刻重新评估，不要因为这里写着 ignore 就放过；
    #   2. `cosmic-text` / `fontdb` 迁移到 `skrifa` 并发布新版，且 iced
    #      跟进——那时候删掉这一条；
    #   3. 每次升 iced 大版本时顺手复查一次这条还在不在。
    "RUSTSEC-2026-0192",
]

[licenses]
# rmc-core 自己的 `license = "UNLICENSED"`（workspace 内部专有代码的
# 惯例写法）不是合法的 SPDX 表达式，会被判成 "unlicensed" 错误——这
# 不是第三方依赖的问题，是我们自己这份从不对外发布的源码。配合
# `Cargo.toml` 里的 `publish = false`，让 cargo-deny 跳过对它自己的
# 许可证检查，只审计真正会被编译进二进制、对外分发的第三方依赖。
private = { ignore = true }

# 之前的核查确认：依赖图里除下面这一条之外，所有不在这份 allow 列表
# 里的许可证标识符都只出现在带允许项的 `OR` 表达式里（cargo-deny 判定
# 只要 `OR` 的任意一侧被允许即算通过），不需要逐个列出。
#
# `webpki-roots` 是这份列表里唯一的例外：它的许可证是裸的
# `CDLA-Permissive-2.0`（Community Data License Agreement，不是
# `OR` 表达式的一部分），且不在 brief 原始草稿给的列表里——`cargo deny
# check licenses` 会因此变红。这是一次刻意拍板，不是被 CI 逼红之后
# 顺手糊过去：`webpki-roots` 打包的是 Mozilla 维护的 CA 根证书集合，
# CDLA-Permissive-2.0 是一份宽松型的**数据**许可（允许自由使用、修改、
# 分发，不要求开源衍生作品），性质上类似 CC-BY，用来给"这一批证书数据
# 能不能被打进闭源客户端"这件事发许可，不是给可执行代码发许可；
# 允许它进这份列表不会把任何 copyleft 义务带进这个 crate。
#
# `BSL-1.0` 是第二个例外，随 Task 6 的 iced 界面层进来，同样是一次刻意
# 拍板：
#
# **是哪些包**：`clipboard-win 5.4.1` 与它的依赖 `error-code 3.4.0`，
# 经 `iced` → `iced_winit` → `window_clipboard` 拉进来，负责 Windows 上的
# 剪贴板读写（界面里"复制诊断信息"这类操作要用）。
#
# **为什么绕不开**：`window_clipboard` 是 iced 官方的剪贴板抽象，Windows
# 后端就是 `clipboard-win`。除非不用 iced、或者自己 fork 掉剪贴板支持，
# 否则这两个包必然在依赖图里。
#
# **为什么可以接受**：Boost Software License 1.0 是 OSI 认可、FSF 认定
# 自由的宽松许可，条款比 MIT 还宽松——二进制分发形式下甚至不要求随附
# 版权声明，没有任何 copyleft 义务，不会因为链接它而要求我们开源。
#
# **什么条件下重新评估**：如果哪天 `window_clipboard` 换了 Windows 后端
# 实现、或者我们不再依赖 iced，复查这一条是否还有包在用；判断依据是
# `cargo deny check licenses` 不再因为移除它而变红。
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]

[bans]
# 只是警告，不 deny：`cargo deny check bans` 实测报出 12 组重复
# 版本——`windows-sys`（`ring`/`errno` 等各自拉了不同的版本，Windows
# 专用代码，不影响 Linux 构建）与 `syn`（proc-macro 构建期依赖，两个
# 版本互不链接进最终产物）确实无害，但 `sha2`/`sha3`/`digest`/`rand`/
# `rand_core`/`crypto-common`/`generic-array`/`block-buffer`/
# `cpufeatures`/`getrandom` 这一批不是——本 crate 自己直接依赖
# `sha2 = "0.10"`、`rand = "0.8"`（`sha2 0.10.9`/`rand_core 0.6.4`
# 那条线），而 `russh` 生态（`ssh-key`/`aes-gcm`/`ml-kem` 等）拉的是
# 更新的 `sha2 0.11`/`rand 0.10`/`rand_core 0.10`——这是两套同名密码学
# 原语真的被编进同一个二进制，跟 Windows 完全无关。裁定仍然是
# `"warn"`：这些版本分叉来自上游各自的发布节奏，不是本 crate 能单方面
# 消掉的（`russh` 才是决定它用哪个 `sha2`/`rand` 大版本的一方），
# 强行 `deny` 只会让 `cargo update` 稍微碰到这条线就直接把 CI 逼红，
# 对二进制体积/编译时间的实际影响也小于强行对齐版本要付出的维护
# 成本；但理由不能只举最无害的那条，免得下次有人以为"反正都是
# windows-sys 那种小事"就把 `warn` 顺手改成 `allow` 甚至删掉整个
# `[bans]` 段。
multiple-versions = "warn"
# 明确禁止把 OpenSSL 拖进来，TLS 只用 rustls。
deny = [{ name = "openssl-sys" }, { name = "native-tls" }]
