name: core

# R——CI（Task 12）：这份工作流要还的债是"本仓库至今没有任何 CI 会构建
# Rust"——`gateway.yml` 的 paths 过滤器从来没包含 `crates/**`，改
# rmc-core 一个字都不会触发任何工作流。下面的过滤器必须覆盖
# `crates/**`、workspace 级 `Cargo.*`、`deny.toml`、`rust-toolchain.toml`
# 与这份文件自己。
#
# `gateway/**`（Task 12 说明）：这一条原本是为了让 `integration` job 的
# docker 夹具（docker-compose.yml、sshd_tunnel_config、haproxy.cfg）改动
# 也能触发 CI。**那个 job 在 Task 12 被整个删掉了**——网关不再是
# sshd/haproxy/docker 拼出来的，集成测试换成了 `crates/rmc-gateway/tests/
# e2e.rs` 那 15 条进程内端到端。`gateway/` 那个目录连同里面的东西由
# Task 13 一并删除，**这一条 paths 也留给 Task 13 一起拿掉**：现在就删
# 会让"那个目录还在、改它却不触发任何 CI"多存在一个提交的窗口。
#
# R（复审发现，中低）：`rust-toolchain.toml` 决定 CI 实际用的编译器
# （目录级 override，优先级比 `dtolnay/rust-toolchain` 那一步的
# `rustup default` 更高），原来没进过滤器——改它不会触发这份工作流，
# "MSRV 1.89 真的够用"这件事就没人在验证。见下面
# `unit_job_pins_the_toolchain_to_the_documented_msrv` 测试与
# task-12-report.md。
#
# R（Task 12 追加）：`.github/workflows/app.yml` 也在里面，理由是一条
# 真实的「安静地不跑」：守住 app.yml 的那份测试
# （`crates/rmc-core/tests/app_workflow.rs`，跟 ci_workflow.rs 共用
# `tests/workflow_yaml/` 的辅助）跑在 `cargo test -p rmc-core` 里，而
# `app.yml` 自己的两个 job 跑的是 `-p rmc-win -p rmc-app`——没有这一行，
# 只改 app.yml 的提交不会触发任何会执行那份守卫测试的工作流。
# `app_workflow.rs` 的
# `editing_app_yml_triggers_the_workflow_that_runs_its_guard_test`
# 钉住这一行。
on:
  push:
    paths: ["crates/**", "gateway/**", "Cargo.toml", "Cargo.lock", "deny.toml", "rust-toolchain.toml", ".github/workflows/core.yml", ".github/workflows/app.yml"]
  pull_request:
    paths: ["crates/**", "gateway/**", "Cargo.toml", "Cargo.lock", "deny.toml", "rust-toolchain.toml", ".github/workflows/core.yml", ".github/workflows/app.yml"]

jobs:
  # 格式、clippy（-D warnings，本仓库一贯的验证标准）、rmc-core 与
  # rmc-gateway 两个 crate 的全部测试——包括 Task 12 那 15 条进程内端到端
  # （`crates/rmc-gateway/tests/e2e.rs`）。没有一条挂 `#[ignore]`，也不
  # 需要 docker，所以"跑没跑"这件事不再取决于有没有人记得传 `--ignored`。
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@1.89
        with:
          components: rustfmt, clippy

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2

      - name: 格式检查
        run: cargo fmt --all -- --check

      # Task 12 起多了 `-p rmc-gateway`。**rmc-gateway 到这一刻为止一次
      # 都没进过 CI**：这两条命令原来都只点名 rmc-core，只有上面的
      # `cargo fmt --all` 覆盖全工作区。Task 2-9 写出来的那七批代码从来
      # 没有在 CI 里被 `-D warnings` 过一遍（本地闸门有 `--workspace`，
      # 所以实际上是干净的，见 task-12-report.md 里贴的首次完整输出，
      # 但"靠本地纪律"与"CI 会拦"是两回事）。
      - name: clippy
        run: cargo clippy -p rmc-core -p rmc-gateway --all-targets -- -D warnings

      - name: 单元与端到端测试
        # 这个 crate 已经被"失败路径报不出错、只会一直挂着"坑过不止一次
        # （见 ssh::test_support 模块文档、Task 7 报告）——外层 timeout
        # 保证卡死时报一条清楚的"超时被杀"，而不是干等到 GitHub Actions
        # 自己的 job 级超时、什么诊断信息都没有。
        #
        # `-p rmc-gateway` 把 `crates/rmc-gateway/tests/e2e.rs` 那 15 条
        # 进程内端到端也带进来——它们不需要 docker、不带 `#[ignore]`，
        # 所以这一步就是它们的运行处，不再有单独的 integration job。
        run: timeout 600 cargo test -p rmc-core -p rmc-gateway

  # Task 12 新增：运维服务器的发布产物。
  #
  # 它替掉的是原来那个 `integration` job（docker compose 起 sshd+haproxy，
  # 再在容器里跑 17 条 `#[ignore]` 测试）。那套东西连同它验证的目标一起
  # 消失了：网关不再是 sshd/haproxy/docker 拼出来的，而是这一个二进制。
  # 所以这里要证的事情也换了——不是"那套拼装还能跑起来"，而是
  # **"这一个二进制真的能静态链接出来、真的可以丢到任意一台 Linux 上跑"**。
  #
  # musl 而不是 glibc：运维服务器要能拷到客户那台不知道是什么发行版、
  # glibc 什么版本的机器上直接跑。`file | grep -q 'statically linked'`
  # 这一步不能省——`--target x86_64-unknown-linux-musl` 构建成功**不等于**
  # 产物是静态的（任何一条走 build.rs 链了系统库的依赖都会让它退化成
  # 动态链接），而那种退化不会让 `cargo build` 失败，只会在客户那台机器
  # 上表现成一句 "No such file or directory"。
  gateway-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@1.89
        with:
          targets: x86_64-unknown-linux-musl

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2

      - name: 安装 musl 工具链
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools

      - name: 构建 musl 静态二进制
        run: cargo build --release -p rmc-gateway --target x86_64-unknown-linux-musl

      # 三条断言合成一条命令：产物在、`file` 认得它、而且它说的是
      # "statically linked"。`grep -q` 不匹配时退出码非零，这一步就红。
      - name: 确认是静态链接
        run: |
          bin=target/x86_64-unknown-linux-musl/release/rmc-gateway
          test -f "$bin"
          file "$bin"
          file "$bin" | grep -q 'statically linked'

      # `if-no-files-found: error` 不能省：默认是 `warn`，二进制没产出时
      # 会上传一个空产物并让这一步变绿（同 app.yml 里那条便携包的说明）。
      - name: 上传运维服务器二进制
        uses: actions/upload-artifact@v4
        with:
          name: rmc-gateway-linux-x86_64
          path: target/x86_64-unknown-linux-musl/release/rmc-gateway
          if-no-files-found: error

  # 依赖审计：许可证、安全公告、被禁止的 TLS 实现、多版本重复。裁定与
  # 理由见 deny.toml 本身的注释。
  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
