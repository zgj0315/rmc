name: gateway

on:
  push:
    paths: ["gateway/**", ".github/workflows/gateway.yml"]
  pull_request:
    paths: ["gateway/**", ".github/workflows/gateway.yml"]

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # session 级 harness 固件（gateway/tests/conftest.py）会在 finally 里默认
    # `compose down -v`，除非看到 RMC_KEEP_ENV=1。放在 job 级：让"集成测试"跑完时
    # 容器留着，后面的"脚本测试"（bats）与"失败时导出容器日志"才有容器可以操作，
    # 否则这两步都是对着一个已经被删掉的服务空转。收尾见本文件最后一步。
    env:
      RMC_KEEP_ENV: "1"
    steps:
      - uses: actions/checkout@v4

      - name: 安装测试依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client
          python3 -m venv gateway/.venv
          gateway/.venv/bin/pip install -r gateway/tests/requirements.txt

      - name: 单元测试
        run: cd gateway && .venv/bin/python -m pytest tests/test_registry.py -v

      - name: 集成测试
        run: cd gateway && .venv/bin/python -m pytest tests -v -x --ignore=tests/test_registry.py

      - name: 脚本测试
        run: |
          cd gateway/test-env
          docker compose exec -T gateway bats /gateway/tests/test_scripts.bats

      - name: 失败时导出容器日志
        if: failure()
        run: cd gateway/test-env && docker compose logs --no-color

      - name: 清理测试环境
        if: always()
        run: cd gateway/test-env && docker compose down -v
