# /etc/haproxy/haproxy.cfg
# 443 上终止 TLS 后转给只监听 loopback 的 sshd-tunnel。
# sshd 看到的来源恒为 127.0.0.1，客户端真实来源 IP 以本文件的日志为准。
global
    log stdout format raw local0
    # 打开监听 socket（含 443，特权端口）之后立即降权到 haproxy/haproxy 并
    # chroot 到 /var/lib/haproxy（Debian 包自带这个空目录）。三行都不带会
    # 以 root 常驻——Debian 官方的 haproxy 包默认就带这三行，本文件此前
    # 整份覆盖掉了它，等于给这台互联网暴露的 TLS 终止器开了个权限回归。
    # 已在 test-env 里验证过 chroot 不影响证书加载（证书在 chroot 之前就已
    # 打开）与 TLS 握手：worker 进程（实际处理连接的那个）此后以 haproxy
    # 用户运行，master 进程留在 root 只为了管理 reload。
    user haproxy
    group haproxy
    chroot /var/lib/haproxy
    # 这一行的测试覆盖是间接的：gateway/tests/test_tls_frontend.py 里那条摁死
    # 客户端只谈 TLSv1.1 的负向探针，在实测里删掉这一行之后依然通过——这个
    # haproxy 版本（2.6.12，链接 OpenSSL 3.0）没有这条指令时本身就已经拒绝
    # TLSv1.0/1.1，所以那条用例验证的是"服务端的实际行为"，不是"这一行配置
    # 在起作用"。审计这一行的正确性目前只能靠读代码与看 haproxy/OpenSSL 的
    # 版本能力，没有一条测试能在这一行被删除或改错时变红。
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    # ciphers 管 TLSv1.2 及以下的协商，ciphersuites 只管 TLSv1.3——两条必须
    # 都写，只给后者等于放过了 1.2 那一半：不设 ciphers 时 OpenSSL 退回自带的
    # 默认族，里面还留着 CBC-SHA1 与没有前向保密的静态 RSA 密钥交换。
    ssl-default-bind-ciphers ECDHE+AESGCM:ECDHE+CHACHA20
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend tunnel_in
    bind :443 ssl crt /etc/haproxy/certs/gateway.pem
    default_backend sshd_tunnel

backend sshd_tunnel
    server local 127.0.0.1:2222
