[pytest]
# CI 只跑不带 -W error 的普通 pytest（见 .github/workflows/gateway.yml），
# 而这份套件已经踩过 ResourceWarning 被 GC 悄悄吞掉、把 pytest.fail() 的真正
# 失败原因盖成一条不相干用例上的警告的坑（见 test_zombie_port.py 的注释）。
# 光靠人手动敲 `-W error` 挡不住 CI：这条配置把同样的严格级别钉进 pytest 本身，
# 以后再出现同类 ResourceWarning 回归，会在 CI 上直接变成失败，而不是安静地
# 混进输出里被忽略。
filterwarnings = error
