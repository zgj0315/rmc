[package]
name = "rmc-gateway"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rmc-core.workspace = true
tokio.workspace = true
thiserror.workspace = true
zeroize.workspace = true
tracing.workspace = true
rand.workspace = true
# TLS：与 rmc-core 同一套 provider（ring），只开 1.3
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pki-types = { version = "1", default-features = false, features = ["std"] }
# SSH 服务端那一半；client 那一半 rmc-core 已在用，同一个包
russh = { version = "0.63", default-features = false, features = ["ring"] }
# 自签证书。**新增包**：rcgen + yasna（派发前用仓库的 deny.toml 验过）。
# `zeroize` feature（不新增包——zeroize 1.9 本来就在锁里，是 workspace 依赖）：
# 开了之后 `rcgen::KeyPair: zeroize::Zeroize`
# （rcgen-0.14.10/src/lib.rs:862-867），`identity.rs::tls_cert_and_key` 靠它把
# 签证书用到的那份临时密钥包进 `Zeroizing` 清零，见该函数上的文档注释。
rcgen = { version = "0.14", default-features = false, features = ["ring", "zeroize"] }
# 口令哈希。argon2 / password-hash 本来就在锁里（russh 的依赖）
argon2 = "0.6"
sha2 = "0.10"
base64 = "0.22"
# 账号与配置文件。**新增包**：toml 及其解析/写出子包
toml = "0.9"
serde = { version = "1", features = ["derive"] }
# status.json 与审计日志。**新增包**：serde_json（连带 itoa/zmij）
serde_json = "1"
# 原子写与「当前用户是否 root / 是否目录属主」的探针都靠它（本来就在锁里）
tempfile = "3"

[features]
# 端到端测试用的 TestGateway / FakeAppliance（Task 11）；不进发布二进制
testing = []

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

[lib]
name = "rmc_gateway"
path = "src/lib.rs"

[[bin]]
name = "rmc-gateway"
path = "src/main.rs"
