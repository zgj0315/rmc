[package]
name = "rmc-gateway"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rmc-core.workspace = true
# `serve` 要等 Ctrl+C（`tokio::signal::ctrl_c()`）；workspace 那条
# `tokio.workspace = true` 没开 `signal` feature（别的 crate 不需要它），
# 这里加性地追加——workspace 继承 + `features` 是相加，原有六个 feature
# 仍然生效，不用去动 workspace 那一行。
tokio = { workspace = true, features = ["signal"] }
thiserror.workspace = true
zeroize.workspace = true
tracing.workspace = true
rand.workspace = true
# `main.rs` 装的 stderr 日志订阅者；只有 rmc-app 声明过（`features =
# ["env-filter"]`），不在 `[workspace.dependencies]` 里，锁里已经有它
# （版本对得上），不算新增依赖包。
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# TLS：与 rmc-core 同一套 provider（ring），只开 1.3
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pki-types = { version = "1", default-features = false, features = ["std"] }
# SSH 服务端那一半；client 那一半 rmc-core 已在用，同一个包
russh = { version = "0.63", default-features = false, features = ["ring"] }
# 自签证书。**新增包**：rcgen + yasna（派发前用仓库的 deny.toml 验过）。
# `zeroize` feature（不新增包——zeroize 1.9 本来就在锁里，是 workspace 依赖）：
# 开了之后 `rcgen::KeyPair: zeroize::Zeroize`
# （rcgen-0.14.10/src/lib.rs:862-867），`identity.rs::tls_cert_and_key` 靠它把
# 签证书用到的那份临时密钥包进 `Zeroizing` 清零，见该函数上的文档注释。
rcgen = { version = "0.14", default-features = false, features = ["ring", "zeroize"] }
# 口令哈希。argon2 / password-hash 本来就在锁里（russh 的依赖）
argon2 = "0.6"
sha2 = "0.10"
base64 = "0.22"
# 账号与配置文件。**新增包**：toml 及其解析/写出子包
toml = "0.9"
serde = { version = "1", features = ["derive"] }
# status.json 与审计日志。**新增包**：serde_json（连带 itoa/zmij）
serde_json = "1"
# 原子写与「当前用户是否 root / 是否目录属主」的探针都靠它（本来就在锁里）
tempfile = "3"

[features]
# 端到端测试用的 TestGateway / FakeAppliance（Task 11）；不进发布二进制
testing = []

[dev-dependencies]
# crate 自引用开 feature 的标准写法：集成测试（`tests/*.rs`）是独立的
# crate，它 `use rmc_gateway::testing::…` 时链接的是这一条 dev-dependency
# 声明的 rmc-gateway，`testing` 因此在 `cargo test` 里默认点亮，不需要
# 命令行上带 `--features testing`；而 `cargo build --release` 根本不解析
# dev-dependencies，`testing` 在发布二进制里是关的。
rmc-gateway = { path = ".", features = ["testing"] }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
# 修复轮 2/5：只给本 crate 自己的测试编译单元多开一个 `tls12`——Cargo
# 按依赖种类（normal/build/dev）分别统一 feature，同一个包在
# `[dependencies]`（生产路径）与 `[dev-dependencies]`（只有本 crate的
# 测试二进制会用到）各声明一份，互不传染：不会点亮 `rmc-core` 或别的
# workspace 成员，也不会进 `cargo build --release`（那条路径根本不链
# dev-dependencies）。存在的理由见 `identity.rs` 里
# `identity::tests::a_server_that_also_allows_tls12_is_not_rejected_
# at_version_negotiation` 上的文档。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[lib]
name = "rmc_gateway"
path = "src/lib.rs"

[[bin]]
name = "rmc-gateway"
path = "src/main.rs"
