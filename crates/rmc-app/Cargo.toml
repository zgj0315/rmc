[package]
name = "rmc-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# W101：brief 漏了这一行。`license = "UNLICENSED"` 不是合法 SPDX 表达式，
# `deny.toml` 的 `[licenses.private] ignore = true` 靠 `publish = false`
# 才会跳过本 workspace 自己的源码——漏掉它，`cargo deny check licenses`
# 会因为我们自己的包变红，跟第三方依赖无关。
publish.workspace = true

[dependencies]
# 视图模型（`model.rs`）消费 rmc-core 的 `State`/`TunnelEvent`/
# `RemoteSessionInfo`/`PreflightReport`，并 re-export 它的 `BANNED_WORDS`。
# **不新增依赖包**：rmc-core 本来就在 workspace 里（rmc-win 依赖它），
# 这条只是多一条 workspace 内部的路径依赖边——`Cargo.lock` 里 rmc-app 的
# dependencies 多一行 "rmc-core"，包数不变。
rmc-core.workspace = true
# W101：tracing 已在 `[workspace.dependencies]` 里，写死 "0.1" 会绕开
# 统一版本管理。
tracing.workspace = true
# 口令只用 `Zeroizing<String>` 承载（`form::Form::password`、
# `Message::PasswordChanged`）。**不新增依赖包**：zeroize 已经是
# `[workspace.dependencies]` 的一员，rmc-core 与 rmc-win 都在用，
# Cargo.lock 里的包数不变，只多一条 workspace 内部的依赖边。
zeroize.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 界面框架。**只开 tiny-skia，不开 wgpu**——修复轮 1 的定案：
#
# 1. 0.14 才有 `iced_test`（headless 控件树断言）。Task 6 第一轮报出六条
#    「改了实现但没有任何测试会红」的盲区，其中三条在控件树里，只有
#    `iced_test` 够得着；界面还有 Task 7-11 五个任务要写，盲区只会变大。
# 2. 砍掉 wgpu 把依赖树从 306 包降到 243 包，`cargo deny` 的 advisories
#    从 2 条降到 1 条、licenses 从 3 条降到 1 条。
# 3. 砍掉 wgpu 顺带解决了 windows-gnu 链接失败——`d3dcompiler` 是 wgpu 的
#    DX12 后端要的导入库，zig 的 sysroot 里没有。
# 4. brief 原本要 wgpu+tiny-skia 并存的理由是「RDP 与虚拟机里能起来」。
#    只留 tiny-skia 之后**根本没有 GPU 初始化这条会失败的路**，那个目标
#    反而更稳。代价是纯软件绘制，对这个 520×720、只有文字和几个按钮的
#    工具窗口判为看不出差别。
#
# `tokio` 让 iced 的 runtime 用 tokio 而不是 smol，跟 rmc-core 同一套
# reactor；Task 7 起要把 `TunnelEvent` 的 channel 接进 `Subscription`，
# 这条现在就得定下来。
#
# `advanced` 本任务**一行都没用到**（评审实测摘掉它仍然全绿）。留着是因为
# 它是纯 re-export 开关：`advanced = ["iced_core/advanced",
# "iced_widget/advanced"]`，两侧都是已在依赖图里的 crate 的 feature、没有
# `dep:`，摘掉前后 `Cargo.lock` 一个字节不变、包数同为 400。Task 7 做自定义
# 控件多半要用。
#
# **`default-features = false` 的一个副作用**：0.14 把 `x11` 与 `wayland`
# 放进了 `default`（`iced-0.14.0/Cargo.toml:63-72`），所以这份配置在 Linux
# 上**没有窗口后端**——`cargo run -p rmc-app` 起不来窗口。本产品是 Windows
# 客户端，不打算为此加 feature；但 `cargo test -p rmc-app` 在 Linux 上是
# 能跑也应该跑的（`iced_test` 是无头模拟器，不碰 winit 的窗口创建路径），
# 所以**刻意没用 `compile_error!` 去拦**：那是按 target 判而不是按用途判，
# 会把 Linux 上的 `cargo test --workspace` 一并拦掉。
iced = { version = "0.14", default-features = false, features = [
  "tiny-skia",
  "tokio",
  "advanced",
] }

# 诊断包导出（`diag::bundle`）。**W163：这是本任务唯一的新依赖**，派发前
# 已实测过：解析出 25 个包，但对本工作区真正新增的只有两个——`zip` 与
# `displaydoc`（flate2/crc32fast/indexmap/thiserror/syn 等本来就在锁里）。
# `cargo deny check advisories bans licenses sources` 四项的实际输出见
# task-9-report.md。
#
# `default-features = false` 砍掉 bzip2/zstd/lzma/aes 等一串压缩与加密
# 后端，只留 `deflate`——诊断包里是日志与文本，deflate 够用，而那几个
# 后端全是 C 代码，会把 windows-gnu 的交叉编译（闸门 5/6）拖下水。
zip = { version = "2", default-features = false, features = ["deflate"] }

# 平台实现。**W171：这条依赖从 `[target.'cfg(windows)'.dependencies]` 搬
# 到了这里，成了无条件依赖。**
#
# 理由不是省事，是可观测性。`wiring::spawn_core` 是一对
# `#[cfg(windows)]` / `#[cfg(not(windows))]` 孪生块，而 Task 5 已经用八枪
# 实测过：`#[cfg(windows)]` 那一层里**任何还能编译的语义改动按构造检测
# 不到**（闸门 5 只编译、闸门 6 只静态检查，两道都不跑测试；连把
# `Box::leak` 换成悬垂栈指针都六道全绿）。而这一轮接线里最要紧的两件事
# ——`ProxyEndpointRecorder` 要同时坐在 `Transport` 的 resolver 位和
# 协商器的 endpoint 位（W170）、以及 SPN 必须用代理主机名而不是认证
# 方案——恰恰全在那一支里。
#
# rmc-win 本来就为此做过准备：它的纯逻辑层（`ProxyEndpointRecorder`、
# `SspiProxyAuthenticator`、`EventHub`、`FileSecretStore`）**不带
# `#[cfg(windows)]`**，在 macOS 上照常编译、照常测（`cargo test -p
# rmc-win` 有 137 条）。把依赖提到无条件之后，`wiring` 里那段装配可以整
# 块搬到平台中立的函数里，在这台机器上被真的跑到；`cfg` 块里只剩「构造
# 哪四个实现」这一层纯搬运。
#
# **不新增依赖包**：rmc-win 本来就在 workspace 里，它在非 Windows 上的
# 依赖（rmc-core/tokio/tracing/async-trait/base64/zeroize/sha2）全都已经
# 在锁里；`windows` crate 仍然只在 `cfg(windows)` 下引入。
rmc-win = { path = "../rmc-win" }

# 接线要用 `mpsc::Sender<Command>` / `broadcast::Receiver<TunnelEvent>`，
# 以及 `#[tokio::test]`。**不新增依赖包**：tokio 早就是
# `[workspace.dependencies]` 的一员（rmc-core、rmc-win 都在用），iced 的
# `tokio` feature 也已经把它拉进 rmc-app 的依赖图，这里只是多一条直接
# 依赖边。
tokio.workspace = true


[dev-dependencies]
# headless 控件树断言。只在测试期编译，不进发布二进制。
# 它自带 `iced_renderer/fira-sans`，所以测试里的默认字体是内嵌的 Fira Sans，
# 跟运行时走系统字体不是一回事——见 task-6-fix-1-report.md 关于快照测试的
# 那一节。
iced_test = "0.14"
# 测试里要给 `ProxyResolver` 写假实现，那个 trait 是 `#[async_trait]` 的。
# **不新增依赖包**：`async-trait = "0.1"` 已经是 rmc-win 的直接依赖，
# Cargo.lock 里就有；只在测试期编译。
async-trait = "0.1"
# 差分快照测试要一个临时目录放基线哈希（跑完即扔，不进仓库）。
# **不新增依赖包**：`tempfile = "3"` 已经是 rmc-core 的 dev-dependency，
# Cargo.lock 里就有。
tempfile = "3"
# W150 那条「Tick 真的被订阅了」的唯一观察口。`iced::Subscription` 就是
# `iced_futures::Subscription`，但 `into_recipes` / `Hasher` 这两样
# `iced` 没有 re-export——没有它们，`subscription()` 里除了 recipe 的
# **个数**（`Subscription::units()`）之外什么都验不了，「把 1 秒改成
# 60 秒」一条测试都不会红。
#
# **不新增依赖包**：`iced_futures 0.14` 早就在锁里（iced 自己依赖它），
# 这里只是多一条 dev 依赖边，不进发布二进制。
iced_futures = "0.14"

[lib]
name = "rmc_app"
path = "src/lib.rs"

[[bin]]
name = "rmc"
path = "src/main.rs"
