[package]
name = "rmc-win"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rmc-core.workspace = true
tokio.workspace = true
tracing.workspace = true
async-trait = "0.1"
# 与 rmc-core 同一个版本；Cargo.lock 里本来就有这一项（rmc-core 的
# known_hosts 指纹用它），这条依赖不新增任何依赖边。
base64 = "0.22"
zeroize.workspace = true
# Task 4 的记住密码用它把 key（形如 `tunnel-zhang@gateway.company.com:443`，
# 含冒号与 @）哈希成一个合法文件名。**不新增依赖包**：`sha2 = "0.10"` 已经是
# rmc-core 的直接依赖，Cargo.lock 里就是 0.10.9。（锁里另有一个 0.11.0，是别的
# 包传递性拉进来的，跟这一条无关。）
sha2 = "0.10"

# Win32 调用只在 windows target 上编译；纯逻辑模块（proxy::parse 等）不依赖
# 这一段，在 macOS/Linux 上原生可测。
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  # W6：SecHandle 在这个 feature 里。Task 3 的 AcquireCredentialsHandleW 等
  # 四个 SSPI 符号缺了它会一起「不存在」——feature 表在骨架阶段先备好。
  "Win32_Security_Credentials",
  "Win32_System_Threading",
  # W93：这里原来还有一条 `Win32_System_SystemServices`，连同它上面那条
  # 「DEVICE_NOTIFY_CALLBACK 等不在 System::Power 里」的注释一起**都是
  # 错的**——那个符号在 `Win32_UI_WindowsAndMessaging`（下一行，本来就
  # 开着），`events.rs` 的 `use` 写的就是那个路径。全仓库 grep
  # `SystemServices` 唯一的命中就是那一行 feature 本身。已删。
  "Win32_UI_WindowsAndMessaging",
  "Win32_Networking_WinHttp",
  "Win32_Security_Cryptography",
  "Win32_Security_Authentication_Identity",
  "Win32_System_Power",
  "Win32_Networking_NetworkListManager",
  "Win32_System_Com",
  # W192：通知区图标与气泡通知（`tray.rs`）。`NOTIFYICONDATAW` /
  # `Shell_NotifyIconW` / `NIF_INFO` 都在这个 feature 里；托盘宿主窗口要
  # 的 `CreateWindowExW` / `CreateIcon` / `DestroyIcon` 在上面那条
  # `Win32_UI_WindowsAndMessaging`（本来就开着）。
  #
  # **只加这一条，而且不新增任何包**——它是 `windows` crate 自己的
  # feature，`Cargo.lock` 一个字节不变。这正是不用 `tray-icon` 的理由
  # （那个 crate 对本工作区真新增 48 个包、`cargo deny` 两项变红），
  # 见 `tray.rs` 顶部的 W192。
  #
  # 宿主窗口刻意用系统预定义的 `STATIC` 类而不是自己 `RegisterClassW`：
  # `WNDCLASSW` 挂在 `Win32_Graphics_Gdi` 后面，为一个不上屏的消息窗口
  # 开整个 GDI 不值当（闸门 5 实测报过这条）。
  "Win32_UI_Shell",
] }
