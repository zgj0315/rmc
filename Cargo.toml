[workspace]
resolver = "2"
members = ["crates/rmc-app", "crates/rmc-core", "crates/rmc-win"]

[workspace.package]
edition = "2021"
rust-version = "1.89"
license = "UNLICENSED"
# 不发布到 crates.io——内部专有代码，`UNLICENSED` 不是合法的 SPDX
# 表达式，`cargo deny check licenses` 会把这个字段本身判成
# "unlicensed" 错误。`publish = false` 配合 `deny.toml` 里的
# `[licenses.private]` 让 cargo-deny 跳过对本 workspace 自己代码的
# 许可证检查——审计要看的是"编译进二进制、对外分发的第三方依赖用了
# 什么许可证"，不是这份从不对外发布的私有源码本身叫什么许可证。
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
thiserror = "2"
zeroize = { version = "1", features = ["std"] }
tracing = "0.1"
rand = "0.8"
rmc-core = { path = "crates/rmc-core" }
# W6：计划原文写的是 0.58，但 russh 0.63 经 pageant 已经把 0.62.2 传递性拉进
# Cargo.lock——用 0.58 会在 workspace 里并存两个大版本的 windows crate。
# 0.62 下 rmc-win 的 Win32 代码原有的编译错误从 13 处降到 1 处（其余是本
# workspace 自己代码的问题，不是版本问题）。
windows = "0.62"

# 发布配置（Task 12）。便携包是「现场工程师从邮件里拿到一个 exe 双击」这种
# 分发形态，体积与启动速度都直接算在体验里。
[profile.release]
# 界面是纯软件绘制（iced 只开 tiny-skia，没有 wgpu），"z" 理论上会拖慢
# 光栅化——但这个窗口固定 520x720、内容是文字和几个按钮，只有「已连接时长」
# 每秒触发一次重绘，不存在连续动画。判为看不出差别，先按体积优化。
# 真机上若发现界面迟滞，第一件该试的事就是把这一行改成 3。
opt-level = "z"
lto = true
codegen-units = 1
# **这里曾经有一行 `panic = "abort"`，交付前被去掉了。记下为什么。**
#
# 当时给的理由是「全仓库 `should_panic` 与 `catch_unwind` 各零处（已 grep
# 核过），没有任何代码依赖栈展开」。**后半句是假的**：
# `crates/rmc-win/src/events.rs:712` 的 `std::panic::catch_unwind` 是生产
# 代码——电源事件的 Win32 回调（`unsafe extern "system" fn on_power_event`），
# 由系统线程调用。
#
# 而那一处的文档注释在七个任务之前就写下了这个预言：
#
#   > 它挡不住 `panic = "abort"`（Task 10 的 app crate 如果那样配置，
#   > 这一层就是装饰品）
#
# 依赖里还有两层一并被作废：tokio 的 task harness（`runtime/task/harness.rs`
# 等 10 个文件）——今天一个 `spawn` 任务 panic 只变成 `JoinError`、运行时
# 照活，abort 之后**隧道任务里任何一个 panic 直接带走整个 GUI 进程**；
# winit 的 Windows 后端把整条消息回路包在 `catch_unwind` 里（那是为了不让
# 栈展开穿过 Win32 FFI 边界），abort 之后 panic **不再走「干净退出事件循环」
# 那条路，所有 `Drop` 都不执行——包括托盘的 `NIM_DELETE`**，现场表现是
# 窗口瞬间消失、通知区留一个幽灵圆点。
#
# 最现实的触发点正是验收清单里的正常操作：合盖唤醒 → `tracing::info!` →
# 文件 appender 写盘失败（盘满、路径被域策略重定向、权限）——今天被那层
# `catch_unwind` 吞掉，abort 之后是**客户端在工程师午休回来时凭空消失**，
# 而 `windows_subsystem = "windows"` + `strip` 让它什么都留不下。
#
# 换来的只是二进制小一点。不值。
#
# 崩溃现场取证那件事仍然没做（panic 的文字写进一个没人接的 stderr、符号表
# 被 strip 掉）。装一个把 panic 写进 tracing 的钩子是几行的事，但那几行落在
# `main()` 里，而 `main()` 至今零自动化证据（W216）——记在「交付前还剩什么」
# 表第 1 条，**现在至少三层展开兜底都还在**。
strip = true
