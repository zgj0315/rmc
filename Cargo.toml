[workspace]
resolver = "2"
members = ["crates/rmc-core", "crates/rmc-win"]

[workspace.package]
edition = "2021"
rust-version = "1.89"
license = "UNLICENSED"
# 不发布到 crates.io——内部专有代码，`UNLICENSED` 不是合法的 SPDX
# 表达式，`cargo deny check licenses` 会把这个字段本身判成
# "unlicensed" 错误。`publish = false` 配合 `deny.toml` 里的
# `[licenses.private]` 让 cargo-deny 跳过对本 workspace 自己代码的
# 许可证检查——审计要看的是"编译进二进制、对外分发的第三方依赖用了
# 什么许可证"，不是这份从不对外发布的私有源码本身叫什么许可证。
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
thiserror = "2"
zeroize = { version = "1", features = ["std"] }
tracing = "0.1"
rand = "0.8"
rmc-core = { path = "crates/rmc-core" }
# W6：计划原文写的是 0.58，但 russh 0.63 经 pageant 已经把 0.62.2 传递性拉进
# Cargo.lock——用 0.58 会在 workspace 里并存两个大版本的 windows crate。
# 0.62 下 rmc-win 的 Win32 代码原有的编译错误从 13 处降到 1 处（其余是本
# workspace 自己代码的问题，不是版本问题）。
windows = "0.62"
